################
### MONITORES ###
################
monitor=,1920x1080@100,auto,1


###################
### MEUS PROGRAMAS ###
###################
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$browser = brave


#################
### AUTOSTART ###
#################
exec-once = /usr/lib/polkit-kde-authentication-agent-1
#exec-once = hypridle
exec-once = mpvpaper -o "no-audio --loop" '*' ~/Videos/Red-eye.mp4
exec-once = waybar 
exec-once = hyprpaper
exec-once = nm-applet &
exec-once = hyprlock || hyprlock
exec-once = /home/martins/SAAS/Arch.Jarvis/arch_jarvis/scripts/start_jarvis.sh
#exec-once = swww-daemon
#exec-once = swww img ~/Imagens/Wallpapers/meu-wallpaper.png --transition-type grow --transition-pos 0.854,0.977 --transition-duration 2

#############################
### VARIÁVEIS DE AMBIENTE ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark
env = GDK_BACKEND,wayland,x11

#####################
### APARÊNCIA (DARK) ###
#####################
general {
    gaps_in = 5
    gaps_out = 15
    border_size = 0

    # --- CORREÇÃO DAS BORDAS ---
    # Removido o vermelho neon.
    # Ativa: Cinzento escuro (discreto)
    # col.active_border = rgba(00000000)
    # col.inactive_border = rgba(00000000)    
    # Inativa: Quase preto
    col.inactive_border = rgb(111111)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    
    active_opacity = 0.90
    inactive_opacity = 0.80

    shadow {
        enabled = true
        range = 10
        render_power = 3
        # Sombra preta normal (sem cor vermelha)
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = workspaces,    1,     1.94,  almostLinear, fade
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############
input {
    kb_layout = br
    kb_variant = 
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 

    touchpad {
        natural_scroll = false
    }
}


###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

# Definição de Variáveis (Apps padrão)
$terminal = kitty      # Verifica se usas kitty, alacritty ou foot
$fileManager = thunar # Verifica se usas dolphin, thunar ou nautilus
$menu = wofi --show drun # Ou rofi -show drun

# Apps Principais
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, A, exec, ~/.config/hypr/scripts/audio_toggle.sh

# Atalhos Específicos (Navegador e Ferramentas)
bind = $mainMod, B, exec, brave       # Alterado de $brave para brave direto
bind = $mainMod, Z, exec, code        # VS Code
bind = $mainMod, S, exec, spotify     # Spotify
bind = $mainMod, O, exec, obs         # OBS Studio
bind = $mainMod, D, exec, discord     # Discord (Adicionado)
bind = $mainMod, J, exec, /home/martins/SAAS/Arch.Jarvis/arch_jarvis/scripts/control_jarvis.sh

# --- NOVO: SCREENSHOT (PRINT SCREEN) ---
# Ao apertar 'Print Screen', o cursor muda para uma cruz.
# Seleciona a área e solta. A imagem vai para o teu "Ctrl+V" (Clipboard).
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Gestão de Janelas
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Foco
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover Janela para Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll e Mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimédia
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bind = SUPER, L, exec, hyprlock

# Super + Shift + S: Só executa se o slurp não estiver a rodar
bind = SUPER SHIFT, S, exec, pgrep slurp || grim -g "$(slurp)" - | wl-copy

##############################
### REGRAS DE JANELA ###
##############################
windowrule = suppressevent maximize, class:.*
windowrulev2 = float,class:(xdg-desktop-portal-gtk)
# No final do ficheiro hyprland.conf
windowrulev2 = opacity 0.85 0.7,class:(Thunar)
windowrulev2 = opacity 0.85 0.7,class:(thunar)

# --- Regras de Transparência Individuais ---

# Brave Browser: 90% focado, 80% desfocado
windowrulev2 = opacity 0.90 0.80,class:^(Brave-browser)$

# Discord: 90% focado, 80% desfocado
windowrulev2 = opacity 1.00 0.90,class:^(discord)$

# Opcional: Spotify também costuma ficar bonito assim
windowrulev2 = opacity 0.70 0.70,class:^(Spotify)$

